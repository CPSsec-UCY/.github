name: Update contribution leaderboard

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/update_leaderboard.py"
      - ".github/leaderboard-members.txt"
      - ".github/workflows/leaderboard.yml"

permissions:
  contents: write

concurrency:
  group: contribution-leaderboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate leaderboard
        env:
          LEADERBOARD_TOKEN: ${{ secrets.ORG_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_leaderboard.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md profile/assets/combined-activity.svg
          if git diff --cached --quiet; then
            echo "Leaderboard is already current."
            exit 0
          fi
          git commit -m "chore: refresh contribution leaderboard"
          git push
